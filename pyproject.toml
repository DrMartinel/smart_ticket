[project]
name = "smart-triage"
version = "0.1.0"
description = "Smart Ticket Triage — workspace root"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "services/core-api",
    "services/ai-engine",
    "evals",
]

# Test tooling for whole-workspace runs. `uv sync` installs only the ROOT
# project's dev group, not each member's, so without this a plain
# `uv run pytest` from the repo root fails with "Failed to spawn: pytest"
# even though every member declares pytest in its own dev group. This is
# the union of those groups, so the documented one-command test run works
# from a clean checkout.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "celery-types>=0.26.0",
    "django-stubs[compatible-mypy]>=6.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Pinned EXPLICITLY rather than relying on ruff's implicit default, which
# is not stable across releases: this repo is clean under the historical
# default (E4/E7/E9/F) but ruff 0.16 widened its own default and reports
# 104 findings on the same unchanged code. Without this block, a ruff
# upgrade turns CI red overnight for reasons unrelated to any commit.
#
# Widening this set is a deliberate, separate piece of work — most of those
# 104 are import ordering (I001) and mutable class defaults (RUF012), and
# fixing them touches core-api broadly. See docs/TODO.md.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = [
    "services/core-api/apps",
    "services/core-api/infrastructure",
    "services/ai-engine/tests",
    "evals/suites",
]
# The suites share module names — two different test_injection.py files in
# ai-engine/tests and evals/suites, and a directory named `tests` in more than
# one service. Under the default "prepend" import mode the first one collected
# wins and the others resolve to the wrong file, so a whole-workspace `pytest`
# run died at collection even though each suite passed when run on its own.
# importlib mode imports by file location instead of by assembled module
# name, which makes the duplicate names a non-issue.
#
# That fix covers test MODULES but not conftest.py, which pytest registers as
# a plugin keyed by module name: if two services each have a
# `tests/__init__.py`, both conftests resolve to `tests.conftest` and the
# second one collected raises "Plugin already registered under a different
# name".
# services/ai-engine/tests therefore deliberately has NO __init__.py, so its
# conftest gets a path-derived name. Do not add one back — a whole-workspace
# run dies at collection, while each suite still passes on its own.
addopts = "--import-mode=importlib"

[tool.mypy]
# Run from the repo root as `uv run mypy` (see lint.yml). mypy runs from the
# workspace venv rather than `uvx`, because the django-stubs plugin must import
# Django and the project's settings; the version is pinned by uv.lock.
files = ["services/ai-engine/src", "services/core-api", "evals"]
# Django's generated migrations are not hand-written code.
exclude = ['/migrations/', '/node_modules/']
python_version = "3.13"
# The import roots each service runs from: ai-engine's src layout, core-api's
# `apps.*` / `config.*`, and evals' `suites.*`.
mypy_path = ["services/ai-engine/src", "services/core-api", "evals"]
explicit_package_bases = true
# Test packages are named `tests` in more than one service (the same clash
# pytest's --import-mode=importlib handles); namespace them by path.
namespace_packages = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
# Settings that import with no environment: base.py reads everything from
# os.environ with dev defaults.
django_settings_module = "config.settings.test"

# scikit-learn ships no type information; only the evals calibration scripts use it.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
