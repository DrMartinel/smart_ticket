[project]
name = "smart-triage"
version = "0.1.0"
description = "Smart Ticket Triage — workspace root"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/contracts",
    "services/core-api",
    "services/ai-engine",
    "evals",
]

[tool.uv.sources]
contracts = { workspace = true }

# Test tooling for whole-workspace runs. `uv sync` installs only the ROOT
# project's dev group, not each member's, so without this a plain
# `uv run pytest` from the repo root fails with "Failed to spawn: pytest"
# even though every member declares pytest in its own dev group. This is
# the union of those groups, so the documented one-command test run works
# from a clean checkout.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["services/core-api/tests", "services/ai-engine/tests", "evals/suites"]
# core-api and ai-engine both have a test package literally named `tests`.
# Under the default "prepend" import mode the first one collected wins and
# the second's modules resolve to `tests.<name>` in the wrong package —
# so a whole-workspace `pytest` run died with ModuleNotFoundError even
# though each suite passed when run on its own. importlib mode imports by
# file location instead of by assembled module name, which makes the
# duplicate package name (and the two different test_injection.py files in
# ai-engine/tests and evals/suites) a non-issue.
addopts = "--import-mode=importlib"
