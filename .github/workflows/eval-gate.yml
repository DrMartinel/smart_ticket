# NOTE: this file lived at infra/ci/eval-gate.yml until it was moved here.
# GitHub only reads workflows from .github/workflows/, so for its whole
# existence it was documentation rather than a gate — which is how the
# reference to the non-existent evals/suites/test_build.py survived in it.
#
# Eval CI gate — spec §12.3. "Sửa prompt phải qua CI như sửa code."
#
# Two tiers, because the offline and live-pipeline suites have genuinely
# different infrastructure requirements:
#
#   1. ALWAYS runs, on every PR: masking, router (100% branch
#      coverage, no external deps) + the eval suites that are pure
#      functions (injection regex, quote validator, graph routing edges).
#      No GPU, no LLM, no network — this tier alone catches most
#      regressions and never flakes on infra.
#
#   2. Runs when a real vLLM endpoint is available (self-hosted
#      GPU runner, or a hosted endpoint via secrets) — the live-pipeline
#      suites (retrieval, classification, refusal, end-to-end) against the
#      FULL golden set (EVAL_FULL_RUN=1), gated by report.py's regression
#      rules against the committed baseline.
#
# A bare `ubuntu-latest` GitHub-hosted runner cannot run a 9B local model
# at usable speed — tier 2 needs a self-hosted/GPU runner or a cloud LLM
# endpoint configured via repo secrets. This file documents that
# requirement rather than pretending a hosted runner can do it silently.

name: eval-gate

on:
  pull_request:
    paths: &code_paths
      - "services/core-api/**"
      - "services/ai-engine/**"
      - "evals/**"
      - "infra/migrations/**"
      - ".github/workflows/eval-gate.yml"
  # Also on direct pushes to main. This repo currently merges straight to
  # main, so a PR-only trigger would mean the gate never actually ran.
  push:
    branches: [main]
    paths: *code_paths

jobs:
  offline-suites:
    runs-on: ubuntu-latest
    # Postgres comes from compose, not a `services:` container: pg_search
    # needs `shared_preload_libraries`, a server start flag that `services:`
    # has no way to pass (ADR-0013). Compose builds infra/db/Dockerfile and
    # publishes it on 5434.
    env:
      DATABASE_URL: postgresql://app_user:app_password@localhost:5434/smart_triage
      SECRET_KEY: ci-only-key
      EMBEDDING_PROVIDER: stub
      # No vLLM in this job. Note what that means: retrieval.floor is a
      # CROSS-ENCODER score (ADR-0005), so the refusal-related metrics in this
      # gate are measured against a threshold compared to token-overlap ratios.
      # They protect the wiring, not the retrieval calibration — see
      # docs/TODO.md item 4.
      RERANKER_PROVIDER: lexical
      POSTGRES_AI_RO_PASSWORD: ai_engine_ro_password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - name: Postgres (pgvector + pg_search, ADR-0013)
        run: docker compose -f infra/docker-compose.yml up -d --wait db

      - name: Migrate (applies infra/migrations/sql/* via Django RunSQL)
        working-directory: services/core-api
        run: uv run python manage.py migrate

      - name: Router + masking unit tests (100% branch coverage gate)
        run: |
          uv run pytest services/core-api -q --cov=apps.tickets.utils.router \
            --cov=apps.tickets.utils.masking --cov-report=term-missing --cov-fail-under=100

      - name: ai-engine unit tests
        run: uv run pytest services/ai-engine/tests -q

      # Graph-structure tests live in services/ai-engine/tests/test_build.py and
      # run in the ai-engine step above — this step previously also listed
      # evals/suites/test_build.py, which does not exist, so pytest exited 4.
      - name: Offline eval suites (injection recall, quote validation)
        run: |
          uv run --package evals pytest \
            evals/suites/test_injection.py \
            evals/suites/test_quote_validation.py \
            -q

      - name: Report (offline metrics only)
        run: uv run --package evals python evals/report.py --compare evals/baselines/baseline.json

      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-offline
          path: evals/report.md

  live-pipeline-suites:
    # Requires a self-hosted runner with vLLM (the `vllm` compose profile,
    # or ai-engine's *_BASE_URL pointed at an endpoint via secrets). Skipped
    # automatically if that label isn't available in this repo — remove
    # the `if:` guard once a real runner is provisioned.
    if: ${{ vars.HAS_GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, gpu]
    needs: offline-suites
    env:
      DATABASE_URL: postgresql://app_user:app_password@localhost:5432/smart_triage
      AI_ENGINE_URL: http://localhost:8001
      EMBEDDING_PROVIDER: vllm
      # The shipped default: the cross-encoder served by vllm-rerank. This is
      # the only job with a GPU runner, and item 4 needs its score distribution.
      RERANKER_PROVIDER: vllm
      EVAL_FULL_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - run: docker compose -f infra/docker-compose.yml up -d db redis
      - working-directory: services/core-api
        run: uv run python manage.py migrate
      - name: Start ai-engine
        run: |
          uv run --package ai-engine uvicorn ai_engine.main:app --port 8001 --app-dir services/ai-engine/src &
          for _ in $(seq 1 30); do curl -sf http://localhost:8001/healthz && break; sleep 1; done
      # The demo KB pages are git-ignored; only manifest.json is tracked.
      # Cached per manifest so only the first run for a snapshot fetches
      # (~30 min). fetch.py fetches only what is missing.
      - uses: actions/cache@v4
        with:
          path: demo_kb/guides
          key: demo-kb-${{ hashFiles('demo_kb/manifest.json') }}
      - name: Fetch missing demo KB pages
        run: python3 demo_kb/fetch.py
      # AWS edits its docs; a re-fetched page changes the manifest. That is
      # reported, not failed: the loader applies an approval only to the
      # exact text that was reviewed, so drift can move metrics but never
      # grant auto-reply authority.
      - name: Report demo KB drift from the committed snapshot
        run: git diff --stat --exit-code demo_kb/manifest.json || echo "::warning::demo KB differs from the committed snapshot"
      - name: Load the demo KB
        working-directory: services/core-api
        run: |
          uv run python manage.py shell -c "from apps.accounts.models import User; User.objects.filter(username='kb-approver').exists() or User.objects.create_user('kb-approver', role='manager')"
          uv run python manage.py load_demo_kb --approver kb-approver
      - name: Full-golden-set eval suites
        run: uv run --package evals pytest evals/suites -q
      - name: Report + regression gate
        run: uv run --package evals python evals/report.py --compare evals/baselines/baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-live
          path: evals/report.md
      - name: Comment report on PR
        if: always()
        run: gh pr comment "$PR_NUMBER" --body-file evals/report.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
