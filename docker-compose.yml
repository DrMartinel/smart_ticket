# Pinned to the name it had when this file lived in infra/: compose names
# containers, the network and the db_data volume after the project, so a new
# name would start every existing checkout on an empty database.
name: infra

networks:
  smart-triage:
    driver: bridge

volumes:
  db_data:
  graph_build:
  keycloak_data:
  es_data:

# Every value comes from .env beside this file (`cp .env.example .env`, the
# template that documents each one); nothing here repeats a default, and
# `${X:?}` refuses to start without one. Each service's `environment:` is an
# ALLOWLIST: exactly the settings that service reads, so ai-engine never holds
# core-api's read-write DSN or Django secret (ADR-0004), which `env_file`
# would hand it. The values not taken from .env are container wiring
# (hostnames, DSNs): .env holds the host-side ones (localhost:5434, ...).
# apps/core/tests/test_settings_env.py checks each list against its service.
x-core-api-env: &core-api-env
  DJANGO_SETTINGS_MODULE: config.settings.development
  DATABASE_URL: postgresql://${POSTGRES_APP_USER:?see .env.example}:${POSTGRES_APP_PASSWORD:?see .env.example}@db:5432/${POSTGRES_DB:?see .env.example}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  # core-api's only route to a model: ai-engine is the only vLLM client
  # (ADR-0012), so PII detection and embeddings go through it too.
  AI_ENGINE_URL: http://ai-engine:8001
  ALLOWED_HOSTS: "*"
  # From .env.
  SECRET_KEY: ${SECRET_KEY:?see .env.example}
  DEBUG: ${DEBUG:?see .env.example}
  LOG_LEVEL: ${LOG_LEVEL:?see .env.example}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?see .env.example}
  SHADOW_MODE: ${SHADOW_MODE:?see .env.example}
  MODEL_TIMEOUT_SEC: ${MODEL_TIMEOUT_SEC:?see .env.example}
  MODEL_CONNECT_TIMEOUT_SEC: ${MODEL_CONNECT_TIMEOUT_SEC:?see .env.example}
  AI_ENGINE_ANALYZE_GRACE_SEC: ${AI_ENGINE_ANALYZE_GRACE_SEC:?see .env.example}
  AI_ENGINE_AGENT_READ_TIMEOUT_SEC: ${AI_ENGINE_AGENT_READ_TIMEOUT_SEC:?see .env.example}
  AGENT_SWEEP_INTERVAL_SEC: ${AGENT_SWEEP_INTERVAL_SEC:?see .env.example}
  PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?see .env.example}
  PII_QUARANTINE_TTL_HOURS: ${PII_QUARANTINE_TTL_HOURS:?see .env.example}
  POSTGRES_AI_RO_PASSWORD: ${POSTGRES_AI_RO_PASSWORD:?see .env.example}
  THRESHOLDS_PATH: ${THRESHOLDS_PATH:?see .env.example}
  DEMO_KB_DIR: ${DEMO_KB_DIR:?see .env.example}
  AUTH_ACCESS_TOKEN_LIFETIME_SEC: ${AUTH_ACCESS_TOKEN_LIFETIME_SEC:?see .env.example}
  AUTH_REFRESH_IDLE_HOURS: ${AUTH_REFRESH_IDLE_HOURS:?see .env.example}
  AUTH_SESSION_MAX_HOURS: ${AUTH_SESSION_MAX_HOURS:?see .env.example}
  AUTH_REFRESH_REUSE_GRACE_SEC: ${AUTH_REFRESH_REUSE_GRACE_SEC:?see .env.example}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:?see .env.example}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:?see .env.example}
  LIFECYCLE_HTTP_CONNECT_TIMEOUT_SEC: ${LIFECYCLE_HTTP_CONNECT_TIMEOUT_SEC:?see .env.example}
  LIFECYCLE_HTTP_READ_TIMEOUT_SEC: ${LIFECYCLE_HTTP_READ_TIMEOUT_SEC:?see .env.example}
  LIFECYCLE_HTTP_TOTAL_TIMEOUT_SEC: ${LIFECYCLE_HTTP_TOTAL_TIMEOUT_SEC:?see .env.example}
  LIFECYCLE_RULE_PATTERN_TIMEOUT_SEC: ${LIFECYCLE_RULE_PATTERN_TIMEOUT_SEC:?see .env.example}
  LIFECYCLE_HTTP_MAX_RESPONSE_BYTES: ${LIFECYCLE_HTTP_MAX_RESPONSE_BYTES:?see .env.example}
  LIFECYCLE_WEBHOOK_ALLOWED_HOSTS: ${LIFECYCLE_WEBHOOK_ALLOWED_HOSTS:?see .env.example}
  LIFECYCLE_PUBLIC_BASE_URL: ${LIFECYCLE_PUBLIC_BASE_URL:?see .env.example}
  LIFECYCLE_CALLBACK_WAIT_SEC: ${LIFECYCLE_CALLBACK_WAIT_SEC:?see .env.example}
  LIFECYCLE_RUN_STUCK_SEC: ${LIFECYCLE_RUN_STUCK_SEC:?see .env.example}
  LIFECYCLE_RETRY_BACKOFF_BASE_SEC: ${LIFECYCLE_RETRY_BACKOFF_BASE_SEC:?see .env.example}
  LIFECYCLE_RETRY_BACKOFF_MAX_SEC: ${LIFECYCLE_RETRY_BACKOFF_MAX_SEC:?see .env.example}
  LIFECYCLE_WATCHDOG_INTERVAL_SEC: ${LIFECYCLE_WATCHDOG_INTERVAL_SEC:?see .env.example}
  EMAIL_BACKEND: ${EMAIL_BACKEND:?see .env.example}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?see .env.example}
  EMAIL_HOST: ${EMAIL_HOST:?see .env.example}
  EMAIL_PORT: ${EMAIL_PORT:?see .env.example}
  NOTIFICATION_POLL_SEC: ${NOTIFICATION_POLL_SEC:?see .env.example}
  NOTIFICATION_PUBLIC_BASE_URL: ${NOTIFICATION_PUBLIC_BASE_URL:?see .env.example}
  NOTIFICATION_CHAT_BASE_URL: ${NOTIFICATION_CHAT_BASE_URL:?see .env.example}
  NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY:?see .env.example}
  NOTIFICATION_SWEEP_INTERVAL_SEC: ${NOTIFICATION_SWEEP_INTERVAL_SEC:?see .env.example}
  SLA_SWEEP_INTERVAL_SEC: ${SLA_SWEEP_INTERVAL_SEC:?see .env.example}
  REQUESTER_SWEEP_INTERVAL_SEC: ${REQUESTER_SWEEP_INTERVAL_SEC:?see .env.example}
  SECURITY_SWEEP_INTERVAL_SEC: ${SECURITY_SWEEP_INTERVAL_SEC:?see .env.example}
  ACCESS_SWEEP_INTERVAL_SEC: ${ACCESS_SWEEP_INTERVAL_SEC:?see .env.example}
  INCIDENT_SWEEP_INTERVAL_SEC: ${INCIDENT_SWEEP_INTERVAL_SEC:?see .env.example}
  REPORT_FACTS_BUILD_HOUR: ${REPORT_FACTS_BUILD_HOUR:?see .env.example}
  ROLLOUT_SWEEP_INTERVAL_SEC: ${ROLLOUT_SWEEP_INTERVAL_SEC:?see .env.example}
  OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?see .env.example}
  # Keycloak as the containers reach it; the issuer stays the browser's.
  OIDC_SERVER_URL: http://keycloak:8080
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?see .env.example}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?see .env.example}
  OIDC_REDIRECT_URIS: ${OIDC_REDIRECT_URIS:?see .env.example}
  OIDC_JWKS_CACHE_SEC: ${OIDC_JWKS_CACHE_SEC:?see .env.example}
  OIDC_MIN_REFETCH_SEC: ${OIDC_MIN_REFETCH_SEC:?see .env.example}
  OIDC_CLOCK_SKEW_SEC: ${OIDC_CLOCK_SKEW_SEC:?see .env.example}
  OIDC_HTTP_CONNECT_TIMEOUT_SEC: ${OIDC_HTTP_CONNECT_TIMEOUT_SEC:?see .env.example}
  OIDC_HTTP_READ_TIMEOUT_SEC: ${OIDC_HTTP_READ_TIMEOUT_SEC:?see .env.example}
  KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?see .env.example}
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?see .env.example}
  KEYCLOAK_RUNBOOK_CLIENT_ID: ${KEYCLOAK_RUNBOOK_CLIENT_ID:?see .env.example}
  KEYCLOAK_RUNBOOK_CLIENT_SECRET: ${KEYCLOAK_RUNBOOK_CLIENT_SECRET:?see .env.example}
  ITSM_EXECUTOR_TIMEOUT_SEC: ${ITSM_EXECUTOR_TIMEOUT_SEC:?see .env.example}
  ITSM_RUN_STUCK_SEC: ${ITSM_RUN_STUCK_SEC:?see .env.example}
  ITSM_SWEEP_INTERVAL_SEC: ${ITSM_SWEEP_INTERVAL_SEC:?see .env.example}
  ITSM_GRANTABLE_GROUP_PREFIXES: ${ITSM_GRANTABLE_GROUP_PREFIXES:?see .env.example}
  # The cloud and its observability (F17): the `infra` profile's containers.
  OPENSTACK_AUTH_URL: http://cloud-sim:8090/identity/v3
  ALERTMANAGER_URL: http://alertmanager:9093
  OPENSTACK_SERVICE_DOMAIN: ${OPENSTACK_SERVICE_DOMAIN:?see .env.example}
  OPENSTACK_SERVICE_USER: ${OPENSTACK_SERVICE_USER:?see .env.example}
  OPENSTACK_SERVICE_PASSWORD: ${OPENSTACK_SERVICE_PASSWORD:?see .env.example}
  OPENSTACK_FEDERATION_IDP: ${OPENSTACK_FEDERATION_IDP:?see .env.example}
  OPENSTACK_FEDERATION_PROTOCOL: ${OPENSTACK_FEDERATION_PROTOCOL:?see .env.example}
  INFRA_CONNECT_TIMEOUT_SEC: ${INFRA_CONNECT_TIMEOUT_SEC:?see .env.example}
  INFRA_READ_TIMEOUT_SEC: ${INFRA_READ_TIMEOUT_SEC:?see .env.example}

services:
  db:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    # pgvector + pg_search (ADR-0013). The preload flag is required: without
    # it `CREATE EXTENSION pg_search` fails and BM25 queries error out.
    build: ./infra/db
    image: smart-triage-db:pg17-pg_search-0.25.10
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?see .env.example}
      POSTGRES_USER: ${POSTGRES_APP_USER:?see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?see .env.example}
      # picked up by infra/migrations/sql/0001_extensions_and_roles.sql
      AI_ENGINE_RO_PASSWORD: ${POSTGRES_AI_RO_PASSWORD:?see .env.example}
    ports:
      # Host port 5434 avoids clashing with other locally-running Postgres
      # instances; containers still reach this service at db:5432
      # internally regardless of this host-side mapping.
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER:?see .env.example} -d ${POSTGRES_DB:?see .env.example}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [smart-triage]

  redis:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    image: redis:7-alpine
    ports:
      # Not needed by any container (they all reach redis:6379 over the
      # compose network) — published purely for local dev convenience,
      # e.g. running core-api/worker directly on the host against this
      # same Redis instead of a second one.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [smart-triage]

  core-api:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    command: ["./docker-entrypoint.sh"]
    environment:
      <<: *core-api-env
    # The demo KB snapshot, read by `manage.py load_demo_kb` (DEMO_KB_DIR
    # defaults to this path). Read-only: the container never writes to it.
    volumes:
      - ./demo_kb:/workspace/demo_kb:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  worker:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    environment:
      <<: *core-api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  # Agent turns (F15) on their own queue, so web workers are never held by one.
  worker-agent:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    command:
      - celery
      - -A
      - config
      - worker
      - -Q
      - agent
      - -l
      - info
      - --concurrency=${AGENT_WORKER_CONCURRENCY:?see .env.example}
    environment:
      <<: *core-api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  beat:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment:
      <<: *core-api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [smart-triage]

  ai-engine:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    build:
      context: .
      dockerfile: services/ai-engine/Dockerfile
    environment: &ai-engine-env
      # read-only DSN — the ai_engine_ro role has SELECT-only grants on
      # kb_articles / kb_chunks / fewshot_examples (see infra/migrations/sql).
      # This is a structural permission boundary, not a convention (ADR-0004).
      AI_ENGINE_DATABASE_URL: postgresql://ai_engine_ro:${POSTGRES_AI_RO_PASSWORD:?see .env.example}@db:5432/${POSTGRES_DB:?see .env.example}
      AI_ENGINE_DB_POOL_SIZE: ${AI_ENGINE_DB_POOL_SIZE:?see .env.example}
      AI_ENGINE_DB_MAX_OVERFLOW: ${AI_ENGINE_DB_MAX_OVERFLOW:?see .env.example}
      # The `vllm` profile's servers below (ADR-0009). To reach vLLM
      # elsewhere, set them in docker-compose.override.yml.
      CHAT_BASE_URL: http://vllm-chat:8000/v1
      EMBED_BASE_URL: http://vllm-embed:8000/v1
      RERANK_BASE_URL: http://vllm-rerank:8000/v1
      # From .env. The model names are the same variables the vllm-* servers
      # below load, so ai-engine asks for what they serve.
      CHAT_CLIENT_PROVIDER: ${CHAT_CLIENT_PROVIDER:?see .env.example}
      DRAFT_CLIENT_PROVIDER: ${DRAFT_CLIENT_PROVIDER:?see .env.example}
      NER_CLIENT_PROVIDER: ${NER_CLIENT_PROVIDER:?see .env.example}
      CHAT_MODEL: ${CHAT_MODEL:?see .env.example}
      EMBED_MODEL: ${EMBED_MODEL:?see .env.example}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:?see .env.example}
      SHORTLIST_PROVIDER: ${SHORTLIST_PROVIDER:?see .env.example}
      RERANKER_MODEL: ${RERANKER_MODEL:?see .env.example}
      MODEL_TIMEOUT_SEC: ${MODEL_TIMEOUT_SEC:?see .env.example}
      MODEL_CONNECT_TIMEOUT_SEC: ${MODEL_CONNECT_TIMEOUT_SEC:?see .env.example}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-}
      CLOUD_MODEL: ${CLOUD_MODEL:-}
      CLOUD_MAX_OUTPUT_TOKENS: ${CLOUD_MAX_OUTPUT_TOKENS:?see .env.example}
      GRAPH_VERSION: ${GRAPH_VERSION:?see .env.example}
      PROMPT_VERSION: ${PROMPT_VERSION:?see .env.example}
      PII_NER_PROMPT_VERSION: ${PII_NER_PROMPT_VERSION:?see .env.example}
      DRAFT_PROMPT_VERSION: ${DRAFT_PROMPT_VERSION:?see .env.example}
      RRF_K: ${RRF_K:?see .env.example}
      BM25_TOP_K: ${BM25_TOP_K:?see .env.example}
      VECTOR_TOP_K: ${VECTOR_TOP_K:?see .env.example}
      RERANK_TOP_N: ${RERANK_TOP_N:?see .env.example}
      RERANK_TOP_N_PER_PAGE: ${RERANK_TOP_N_PER_PAGE:?see .env.example}
      FEWSHOT_K: ${FEWSHOT_K:?see .env.example}
      FUSION_CANDIDATE_LIMIT: ${FUSION_CANDIDATE_LIMIT:?see .env.example}
      DRAFT_TEMPERATURE: ${DRAFT_TEMPERATURE:?see .env.example}
      DRAFT_CHUNKS_PER_PAGE: ${DRAFT_CHUNKS_PER_PAGE:?see .env.example}
      QUOTE_FUZZY_THRESHOLD: ${QUOTE_FUZZY_THRESHOLD:?see .env.example}
      LINK_EXPANSION_SEEDS: ${LINK_EXPANSION_SEEDS:?see .env.example}
      LINK_EXPANSION_CHUNKS_PER_PAGE: ${LINK_EXPANSION_CHUNKS_PER_PAGE:?see .env.example}
      LINK_EXPANSION_MAX_LINKS_PER_SEED: ${LINK_EXPANSION_MAX_LINKS_PER_SEED:?see .env.example}
      ASSOCIATION_SOURCE: ${ASSOCIATION_SOURCE:?see .env.example}
      ASSOCIATION_PER_ARTICLE_CAP: ${ASSOCIATION_PER_ARTICLE_CAP:?see .env.example}
      ENTITY_GRAPH_POLICY_VERSION: ${ENTITY_GRAPH_POLICY_VERSION:?see .env.example}
      ENTITY_GRAPH_SECTION_TOKENS: ${ENTITY_GRAPH_SECTION_TOKENS:?see .env.example}
      ENTITY_GRAPH_LLM_MAX_ASYNC: ${ENTITY_GRAPH_LLM_MAX_ASYNC:?see .env.example}
      ENTITY_GRAPH_RESOLVE_MIN_SIMILARITY: ${ENTITY_GRAPH_RESOLVE_MIN_SIMILARITY:?see .env.example}
      GRAPH_BUILD_INTERVAL_MIN: ${GRAPH_BUILD_INTERVAL_MIN:?see .env.example}
      RERANK_POOL: ${RERANK_POOL:?see .env.example}
      JEV_BASE_URL: ${JEV_BASE_URL:?see .env.example}
      JEV_MODEL: ${JEV_MODEL:?see .env.example}
      JEV_API_KEY: ${JEV_API_KEY:-}
      RERANK_PROMPT_VERSION: ${RERANK_PROMPT_VERSION:?see .env.example}
      CATEGORY_QUESTION_VERSION: ${CATEGORY_QUESTION_VERSION:?see .env.example}
      CLARIFY_OPTION_QUESTION_VERSION: ${CLARIFY_OPTION_QUESTION_VERSION:?see .env.example}
      # The agent's tools call core-api inside the network (F15).
      CORE_API_URL: http://core-api:8000
      AGENT_CLIENT_PROVIDER: ${AGENT_CLIENT_PROVIDER:?see .env.example}
      AGENT_PROMPT_VERSION: ${AGENT_PROMPT_VERSION:?see .env.example}
      AGENT_TOOL_CONNECT_TIMEOUT_SEC: ${AGENT_TOOL_CONNECT_TIMEOUT_SEC:?see .env.example}
      AGENT_TOOL_READ_TIMEOUT_SEC: ${AGENT_TOOL_READ_TIMEOUT_SEC:?see .env.example}
      AGENT_ASK_POLL_INTERVAL_SEC: ${AGENT_ASK_POLL_INTERVAL_SEC:?see .env.example}
      AGENT_ASK_WAIT_SEC: ${AGENT_ASK_WAIT_SEC:?see .env.example}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  # The entity graph's scheduled `--pending` build (ADR-0037): re-extracts the
  # pages with a rebuild request every GRAPH_BUILD_INTERVAL_MIN minutes. Same
  # image and allowlist as ai-engine; its pairs file and reply cache live in
  # the graph_build volume, first seeded from the demo KB's committed pairs.
  graph-builder:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    build:
      context: .
      dockerfile: services/ai-engine/Dockerfile
      args:
        SYNC_GROUPS: --group build
    environment: *ai-engine-env
    command:
      - sh
      - -c
      - >-
        test -f /graph/out/entity_graph_pairs.jsonl
        || (mkdir -p /graph/out && cp /seed/entity_graph_pairs.jsonl /graph/out/);
        exec python -m ai_engine.core.associations.build --pending --watch
        --out /graph/out --working-dir /graph/cache
    volumes:
      - graph_build:/graph
      - ./demo_kb/associations:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  # Self-hosted vLLM for every model in the system (ADR-0009). Only ai-engine
  # talks to it (ADR-0012): inference, embeddings and reranking, plus the PII
  # detection and embeddings it serves to core-api. Required for real masking — without it every ticket is
  # MASK_FAILED and goes to a human, by design.
  #
  #   docker compose --profile vllm up -d
  #
  # vLLM serves one model per server and reserves GPU memory up front, so the
  # three share the card through the *_GPU_UTIL fractions — tune them to your
  # VRAM. Not yet run against real hardware: before trusting it, confirm
  # vllm-rerank's score scale (ADR-0005) and re-embed stored vectors
  # (ADR-0009, docs/TODO.md item 4).
  vllm-chat:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:?see .env.example}
    profiles: ["vllm"]
    command:
      - --model=${CHAT_MODEL:?see .env.example}
      - --gpu-memory-utilization=${VLLM_CHAT_GPU_UTIL:?see .env.example}
      - --max-model-len=${VLLM_CHAT_MAX_MODEL_LEN:?see .env.example}
      - --max-num-seqs=${VLLM_CHAT_MAX_NUM_SEQS:?see .env.example}
    volumes:
      - ${HF_CACHE_DIR:?see .env.example}:/root/.cache/huggingface
    ports:
      - "8100:8000"
    deploy: &vllm-gpu
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [smart-triage]

  vllm-embed:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:?see .env.example}
    profiles: ["vllm"]
    command:
      - --model=${EMBED_MODEL:?see .env.example}
      - --gpu-memory-utilization=${VLLM_EMBED_GPU_UTIL:?see .env.example}
      # No CUDA-graph capture: it is the startup step that runs out of
      # memory when three servers share a 12 GiB card, and it buys
      # little for a small encoder.
      - --enforce-eager
    volumes:
      - ${HF_CACHE_DIR:?see .env.example}:/root/.cache/huggingface
    ports:
      - "8101:8000"
    deploy: *vllm-gpu
    networks: [smart-triage]

  vllm-rerank:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:?see .env.example}
    profiles: ["vllm"]
    command:
      # Pin RERANKER_REVISION to a commit sha: left at `main`, an upstream push
      # silently moves the score scale retrieval.floor is compared against
      # (ADR-0005).
      - --model=${RERANKER_MODEL:?see .env.example}
      - --revision=${RERANKER_REVISION:?see .env.example}
      - --gpu-memory-utilization=${VLLM_RERANK_GPU_UTIL:?see .env.example}
      # No CUDA-graph capture: it is the startup step that runs out of
      # memory when three servers share a 12 GiB card, and it buys
      # little for a small encoder.
      - --enforce-eager
    volumes:
      - ${HF_CACHE_DIR:?see .env.example}:/root/.cache/huggingface
    ports:
      - "8102:8000"
    deploy: *vllm-gpu
    networks: [smart-triage]

  admin-console:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    build:
      context: ./services/admin-console
      # Baked into the browser bundle at build time (see its Dockerfile).
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?see .env.example}
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?see .env.example}
    ports:
      - "3000:3000"
    depends_on:
      - core-api
    networks: [smart-triage]

  chat:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    build:
      context: ./services/chat
      # Baked into the browser bundle at build time (see its Dockerfile).
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?see .env.example}
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:?see .env.example}
    ports:
      - "3001:3001"
    depends_on:
      - core-api
    networks: [smart-triage]

  # Dev identity provider (F13, ADR-0032), off by default:
  # `docker compose --profile sso up -d keycloak`. The realm, its clients and
  # test users come from infra/keycloak/; client secrets come from .env.
  keycloak:
    restart: ${COMPOSE_RESTART_POLICY:?see .env.example}
    image: quay.io/keycloak/keycloak:26.4
    profiles: ["sso"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?see .env.example}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?see .env.example}
      # Tokens name the browser's address; core-api's back-channel calls use
      # whichever host they arrive on.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?see .env.example}
      KC_PROXY_HEADERS: ${KEYCLOAK_PROXY_HEADERS:-}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?see .env.example}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?see .env.example}
      KEYCLOAK_RUNBOOK_CLIENT_SECRET: ${KEYCLOAK_RUNBOOK_CLIENT_SECRET:?see .env.example}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/smart-ticket-realm.json:/opt/keycloak/data/import/smart-ticket-realm.json:ro
      - ./infra/keycloak/themes/smart-ticket:/opt/keycloak/themes/smart-ticket:ro
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  # The simulated cloud and its observability (F17, ADR-0048), off by default:
  # `docker compose --profile infra up -d`. Host ports sit beside the usual
  # ones (9201, 5602, 8201, 9091, 9092, 9094, 8090) to avoid collisions.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["infra"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?see .env.example}
      ES_JAVA_OPTS: -Xms${ELASTICSEARCH_HEAP:?see .env.example} -Xmx${ELASTICSEARCH_HEAP:?see .env.example}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsu elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [smart-triage]

  # One-shot: gives kibana_system its password, then exits.
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["infra"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?see .env.example}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?see .env.example}
    command:
      - sh
      - -c
      - >-
        curl -fsS -u "elastic:$$ELASTIC_PASSWORD" -H "Content-Type: application/json"
        -X POST http://elasticsearch:9200/_security/user/kibana_system/_password
        -d "{\"password\": \"$$KIBANA_SYSTEM_PASSWORD\"}"
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [smart-triage]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["infra"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?see .env.example}
    ports:
      - "5602:5601"
    depends_on:
      es-setup:
        condition: service_completed_successfully
    networks: [smart-triage]

  # Receives cloud-sim's OTLP logs and traces (Elastic APM).
  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.3
    profiles: ["infra"]
    command: ["--strict.perms=false"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?see .env.example}
    volumes:
      - ./infra/observability/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    ports:
      - "8201:8200"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [smart-triage]

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["infra"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9091:9090"
    networks: [smart-triage]

  # The only way core-api queries Prometheus: adds the caller's `project`
  # matcher to every query (ADR-0048 §3).
  prom-label-proxy:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.11.0
    profiles: ["infra"]
    command:
      - -label=project
      - -upstream=http://prometheus:9090
      - -insecure-listen-address=0.0.0.0:8080
      - -enable-label-apis
    ports:
      - "9092:8080"
    depends_on: [prometheus]
    networks: [smart-triage]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["infra"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9094:9093"
    networks: [smart-triage]

  # A simulated OpenStack (F17): Keystone, Nova, Cinder and Neutron, its
  # metrics for Prometheus, and OTLP logs and traces to the APM Server.
  cloud-sim:
    build:
      context: .
      dockerfile: services/cloud-sim/Dockerfile
    profiles: ["infra"]
    environment:
      OPENSTACK_SERVICE_USER: ${OPENSTACK_SERVICE_USER:?see .env.example}
      OPENSTACK_SERVICE_PASSWORD: ${OPENSTACK_SERVICE_PASSWORD:?see .env.example}
      CLOUD_SIM_OTLP_ENDPOINT: http://apm-server:8200
      CLOUD_SIM_TICK_SEC: ${CLOUD_SIM_TICK_SEC:?see .env.example}
      CLOUD_SIM_TRANSITION_SEC: ${CLOUD_SIM_TRANSITION_SEC:?see .env.example}
      CLOUD_SIM_TOKEN_TTL_SEC: ${CLOUD_SIM_TOKEN_TTL_SEC:?see .env.example}
    ports:
      - "8090:8090"
    networks: [smart-triage]
