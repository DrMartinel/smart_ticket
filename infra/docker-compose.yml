networks:
  smart-triage:
    driver: bridge

volumes:
  db_data:

x-core-api-env: &core-api-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me}
  DEBUG: ${DEBUG:-true}
  SHADOW_MODE: ${SHADOW_MODE:-true}
  DATABASE_URL: postgresql://${POSTGRES_APP_USER:-app_user}:${POSTGRES_APP_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-smart_triage}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  AI_ENGINE_URL: http://ai-engine:8001
  # Self-hosted vLLM (ADR-0009) — the `vllm` profile below. PII detection runs
  # on the chat server's model; embeddings must match ai-engine's.
  VLLM_CHAT_BASE_URL: ${VLLM_CHAT_BASE_URL:-http://vllm-chat:8000/v1}
  VLLM_CHAT_MODEL: ${VLLM_CHAT_MODEL:-Qwen/Qwen3-8B-AWQ}
  VLLM_EMBED_BASE_URL: ${VLLM_EMBED_BASE_URL:-http://vllm-embed:8000/v1}
  VLLM_EMBED_MODEL: ${VLLM_EMBED_MODEL:-BAAI/bge-m3}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-vllm}
  # Ceiling for a single model call (NER, embeddings). Must stay below the
  # gunicorn --timeout in docker-entrypoint.sh, since masking runs inline.
  MODEL_TIMEOUT_SEC: ${MODEL_TIMEOUT_SEC:-120}
  MODEL_CONNECT_TIMEOUT_SEC: ${MODEL_CONNECT_TIMEOUT_SEC:-3}
  PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-Zm9yLWRldi1vbmx5LTMyLWJ5dGUta2V5LWhlcmUhISE=}
  THRESHOLDS_PATH: /workspace/services/core-api/config/thresholds.yaml
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: http://localhost:3000

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_triage}
      POSTGRES_USER: ${POSTGRES_APP_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-app_password}
      # picked up by infra/migrations/sql/0001_extensions_and_roles.sql
      AI_ENGINE_RO_PASSWORD: ${POSTGRES_AI_RO_PASSWORD:-ai_engine_ro_password}
    ports:
      # Host port 5434 avoids clashing with other locally-running Postgres
      # instances; containers still reach this service at db:5432
      # internally regardless of this host-side mapping.
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER:-app_user} -d ${POSTGRES_DB:-smart_triage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [smart-triage]

  redis:
    image: redis:7-alpine
    ports:
      # Not needed by any container (they all reach redis:6379 over the
      # compose network) — published purely for local dev convenience,
      # e.g. running core-api/worker directly on the host against this
      # same Redis instead of a second one.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [smart-triage]

  core-api:
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    command: ["./docker-entrypoint.sh"]
    environment:
      <<: *core-api-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  worker:
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    environment:
      <<: *core-api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  beat:
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment:
      <<: *core-api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [smart-triage]

  ai-engine:
    build:
      context: ..
      dockerfile: services/ai-engine/Dockerfile
    environment:
      # read-only DSN — the ai_engine_ro role has SELECT-only grants on
      # kb_articles / kb_chunks / fewshot_examples (see infra/migrations/sql).
      # This is a structural permission boundary, not a convention (ADR-0004).
      DATABASE_URL: postgresql://ai_engine_ro:${POSTGRES_AI_RO_PASSWORD:-ai_engine_ro_password}@db:5432/${POSTGRES_DB:-smart_triage}
      # ai-engine's self-hosted models run on vLLM (ADR-0009) — start the
      # `vllm` profile below. The base URLs default to those services.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-vllm}
      VLLM_CHAT_BASE_URL: ${VLLM_CHAT_BASE_URL:-http://vllm-chat:8000/v1}
      VLLM_CHAT_MODEL: ${VLLM_CHAT_MODEL:-Qwen/Qwen3-8B-AWQ}
      VLLM_EMBED_BASE_URL: ${VLLM_EMBED_BASE_URL:-http://vllm-embed:8000/v1}
      VLLM_EMBED_MODEL: ${VLLM_EMBED_MODEL:-BAAI/bge-m3}
      VLLM_RERANK_BASE_URL: ${VLLM_RERANK_BASE_URL:-http://vllm-rerank:8000/v1}
      # `vllm` serves the bge-reranker-v2-m3 cross-encoder from vllm-rerank;
      # `lexical` is for CI and is a different calibration from the
      # cross-encoder score retrieval.floor is specified against (ADR-0005).
      # See docs/TODO.md item 4.
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-vllm}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      # Ceiling for a single model call, shared with core-api; infer.py clamps
      # to whichever of this and the per-ticket latency budget is smaller.
      MODEL_TIMEOUT_SEC: ${MODEL_TIMEOUT_SEC:-120}
      MODEL_CONNECT_TIMEOUT_SEC: ${MODEL_CONNECT_TIMEOUT_SEC:-3}
      # Optional cloud primary with vLLM as the fallback link (spec §10.3).
      # Unset CLOUD_API_KEY means vLLM-only, which is the default here. Any
      # half-configuration fails the boot rather than quietly degrading — see
      # infra/.env.example for the per-provider rules and ADR-0007 for why
      # anthropic/gemini cannot honour MODEL_CONNECT_TIMEOUT_SEC.
      CLOUD_PROVIDER: ${CLOUD_PROVIDER:-openai}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-}
      CLOUD_MODEL: ${CLOUD_MODEL:-claude-sonnet-5}
      CLOUD_MAX_OUTPUT_TOKENS: ${CLOUD_MAX_OUTPUT_TOKENS:-4096}
      GRAPH_VERSION: v2.1
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  # Self-hosted vLLM for every model in the system (ADR-0009): ai-engine's
  # inference, embeddings and reranking, and core-api's PII detection and
  # embeddings. Required for real masking — without it every ticket is
  # MASK_FAILED and goes to a human, by design.
  #
  #   docker compose --profile vllm up -d
  #
  # vLLM serves one model per server and reserves GPU memory up front, so the
  # three share the card through the *_GPU_UTIL fractions — tune them to your
  # VRAM. Not yet run against real hardware: before trusting it, confirm
  # vllm-rerank's score scale (ADR-0005) and re-embed stored vectors
  # (ADR-0009, docs/TODO.md item 4).
  vllm-chat:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-latest}
    profiles: ["vllm"]
    command:
      - --model=${VLLM_CHAT_MODEL:-Qwen/Qwen3-8B-AWQ}
      - --gpu-memory-utilization=${VLLM_CHAT_GPU_UTIL:-0.6}
      - --max-model-len=${VLLM_CHAT_MAX_MODEL_LEN:-8192}
    volumes:
      - ${HF_CACHE_DIR:-./.hf-cache}:/root/.cache/huggingface
    ports:
      - "8100:8000"
    deploy: &vllm-gpu
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [smart-triage]

  vllm-embed:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-latest}
    profiles: ["vllm"]
    command:
      - --model=${VLLM_EMBED_MODEL:-BAAI/bge-m3}
      - --gpu-memory-utilization=${VLLM_EMBED_GPU_UTIL:-0.1}
    volumes:
      - ${HF_CACHE_DIR:-./.hf-cache}:/root/.cache/huggingface
    ports:
      - "8101:8000"
    deploy: *vllm-gpu
    networks: [smart-triage]

  vllm-rerank:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-latest}
    profiles: ["vllm"]
    command:
      # Pin RERANKER_REVISION to a commit sha: left at `main`, an upstream push
      # silently moves the score scale retrieval.floor is compared against
      # (ADR-0005).
      - --model=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - --revision=${RERANKER_REVISION:-main}
      - --gpu-memory-utilization=${VLLM_RERANK_GPU_UTIL:-0.1}
    volumes:
      - ${HF_CACHE_DIR:-./.hf-cache}:/root/.cache/huggingface
    ports:
      - "8102:8000"
    deploy: *vllm-gpu
    networks: [smart-triage]

  web:
    build:
      context: ../services/web
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - core-api
    networks: [smart-triage]
