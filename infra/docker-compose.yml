networks:
  smart-triage:
    driver: bridge

volumes:
  db_data:

x-core-api-env: &core-api-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me}
  DEBUG: ${DEBUG:-true}
  SHADOW_MODE: ${SHADOW_MODE:-true}
  DATABASE_URL: postgresql://${POSTGRES_APP_USER:-app_user}:${POSTGRES_APP_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-smart_triage}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  AI_ENGINE_URL: http://ai-engine:8001
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-Zm9yLWRldi1vbmx5LTMyLWJ5dGUta2V5LWhlcmUhISE=}
  THRESHOLDS_PATH: /workspace/services/core-api/config/thresholds.yaml
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: http://localhost:3000

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_triage}
      POSTGRES_USER: ${POSTGRES_APP_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-app_password}
      # picked up by infra/migrations/sql/0001_extensions_and_roles.sql
      AI_ENGINE_RO_PASSWORD: ${POSTGRES_AI_RO_PASSWORD:-ai_engine_ro_password}
    ports:
      # Host port 5434 avoids clashing with other locally-running Postgres
      # instances; containers still reach this service at db:5432
      # internally regardless of this host-side mapping.
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER:-app_user} -d ${POSTGRES_DB:-smart_triage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [smart-triage]

  redis:
    image: redis:7-alpine
    ports:
      # Not needed by any container (they all reach redis:6379 over the
      # compose network) — published purely for local dev convenience,
      # e.g. running core-api/worker directly on the host against this
      # same Redis instead of a second one.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [smart-triage]

  core-api:
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    command: ["./docker-entrypoint.sh"]
    environment:
      <<: *core-api-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  worker:
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    environment:
      <<: *core-api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  beat:
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment:
      <<: *core-api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [smart-triage]

  ai-engine:
    build:
      context: ..
      dockerfile: services/ai-engine/Dockerfile
    environment:
      # read-only DSN — the ai_engine_ro role has SELECT-only grants on
      # kb_articles / kb_chunks / fewshot_examples (see infra/migrations/sql).
      # This is a structural permission boundary, not a convention (ADR-0004).
      DATABASE_URL: postgresql://ai_engine_ro:${POSTGRES_AI_RO_PASSWORD:-ai_engine_ro_password}@db:5432/${POSTGRES_DB:-smart_triage}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_INFER_MODEL: ${OLLAMA_INFER_MODEL:-qwen3.5:9b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-lexical}
      GRAPH_VERSION: v2.1
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [smart-triage]

  web:
    build:
      context: ../services/web
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - core-api
    networks: [smart-triage]
