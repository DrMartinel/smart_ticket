[project]
name = "contracts"
version = "0.1.0"
description = "Smart Ticket Triage — shared schema contracts (single source of truth)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
