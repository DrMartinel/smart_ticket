[project]
name = "evals"
version = "0.1.0"
description = "Smart Ticket Triage — eval harness (treat as code, spec §12)"
requires-python = ">=3.13"
dependencies = [
    "contracts",
    "core-api",
    "ai-engine",
    "pytest>=8.3",
    "scikit-learn>=1.5",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suites", "calibration"]

[tool.uv.sources]
contracts = { workspace = true }
core-api = { workspace = true }
ai-engine = { workspace = true }
