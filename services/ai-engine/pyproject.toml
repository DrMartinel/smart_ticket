[project]
name = "ai-engine"
version = "0.1.0"
description = "Smart Ticket Triage — ai-engine (FastAPI + LangGraph), read-only, no routing authority"
requires-python = ">=3.13"
dependencies = [
    "contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "rapidfuzz>=3.10",
    "numpy>=2.1",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Only needed when RERANKER_PROVIDER=cross_encoder. Kept optional so the
# default (RERANKER_PROVIDER=lexical) install stays light and GPU-free —
# install with `uv sync --package ai-engine --extra cross-encoder`.
cross-encoder = [
    "sentence-transformers>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_engine"]

[tool.uv.sources]
contracts = { workspace = true }
