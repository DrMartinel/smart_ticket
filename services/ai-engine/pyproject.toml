[project]
name = "ai-engine"
version = "0.1.0"
description = "Smart Ticket Triage — ai-engine (FastAPI + LangGraph), read-only, no routing authority"
requires-python = ">=3.13"
dependencies = [
    "contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2",
    "langchain-core>=1.5",
    "langchain-openai>=1.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "rapidfuzz>=3.10",
    "numpy>=2.1",
    "pydantic-settings>=2.6",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_engine"]

[tool.uv.sources]
contracts = { workspace = true }
