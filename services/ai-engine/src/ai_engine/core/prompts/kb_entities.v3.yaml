# v3 (2026-10-08): fewer code identifiers. The v2 spike's hand check found
# about half of a random 20 entities were API field and parameter names,
# code identifiers, file and package names (OrderId, TableName, node_modules,
# lambda.norpc), plus a person's name typed as a restriction. v3's guidance
# excludes them; the schema and scoring rules are v2's.
#
# v2 (2026-10-08): terse replies. Under v1 the model wrote a sentence for
# every entity and relationship (~8 entities and ~7 relationships per 500-token
# chunk); 2 of the spike's first 8 articles ran out of vllm-chat's 4,096-token
# context mid-reply, and generation is what limits the build's speed. The
# build reads only entity names and types, so v2 asks for a few-word
# description (LightRAG drops an entity without one) and no relationships.
# Asking was not enough (13% of the spike's articles still overflowed), so
# `extraction_schema` below is enforced by vLLM's guided decoding: the reply
# cannot be longer than these limits allow.
#
# Never edit a version a build has used: make the next one. LightRAG caches
# replies by prompt text, not by `extraction_schema`, so an in-place edit
# would replay old replies under the new rules.
#
# Entity policy for the offline entity_graph build (ADR-0018). Versioned and
# reviewed like a prompt: ENTITY_POLICY_VERSION names the file in use, and
# the version is part of every row's build_id.
#
# Two kinds of rule, deliberately kept apart:
#
# - `entity_types_guidance` is sent to the model (LightRAG's extraction
#   prompt). Changing it changes what is extracted, so the whole KB must be
#   re-extracted: the build does that when the version changes.
# - `allowed_types`, `aliases` and `stoplist` are applied when scoring
#   mentions.jsonl. Changing them needs only `build --rescore-only`, no model
#   call, so anything likely to be tuned belongs here.

entity_types_guidance: |
  This text is IT support documentation. Extract only entities a support
  ticket could be about, and classify each with one of these types:

  - Service: a cloud service, product or feature (Amazon SES, IAM Identity Center, S3 bucket policy)
  - Restriction: a limit, quota, sandbox, requirement or permission boundary (SES sandbox, sending quota, MFA requirement)
  - Symptom: an error, failure or observable problem (AccessDenied error, bounced email, throttling)
  - Action: something a person does to fix or configure (request production access, verify an identity, rotate a key)
  - Setting: a configuration value, policy, role or option (DKIM record, trust policy, password policy)

  Do not extract people or names of people (including example users),
  teams, support channels, durations, UI screens or menus, or URLs. Do not
  extract code: API parameter or field names, variable or class names, JSON
  keys, CLI flags, file names, paths or package names. An IAM action or a
  managed policy name (ec2:DescribeInstances, AmazonS3ReadOnlyAccess) is a
  Setting and may be extracted. Name every entity in English, as the documentation names
  it, without a leading article.

  Keep the reply short. Give each entity a description of at most five
  words. Return an empty relationships list: relationships are not used.

# The JSON schema the extraction reply is decoded against (adapter.py).
# Bounds the reply: 25 entities of a 60-character description each stay
# well inside what a 500-token chunk's ~2,400-token prompt leaves of vllm-chat's
# 4,096. Relationships are never read, so none are allowed.
extraction_schema:
  max_entities_per_chunk: 25
  description_max_chars: 60

# Types kept when scoring; LightRAG lowercases the model's types.
allowed_types: [service, restriction, symptom, action, setting]

# Alias -> canonical name, compared case-insensitively. Empty until the spike
# check's hand review shows which names drift.
aliases: {}

# Entity names never used for an edge, compared case-insensitively. Empty
# until the spike check: generic names that link everything are cut by
# ASSOCIATION_HUB_DF_MAX already.
stoplist: []
