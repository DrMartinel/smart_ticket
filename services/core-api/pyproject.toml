[project]
name = "core-api"
version = "0.1.0"
description = "Smart Ticket Triage — core-api (Django + Django Ninja), source of truth"
requires-python = ">=3.13"
dependencies = [
    "contracts",
    "django>=5.1",
    "django-ninja>=1.3",
    "django-ninja-extra>=0.21",
    "django-ninja-jwt>=5.3",
    "celery[redis]>=5.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "cryptography>=43.0",
    "httpx>=0.27",
    "rapidfuzz>=3.10",
    "numpy>=2.1",
    "gunicorn>=23.0",
    "django-cors-headers>=4.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

[tool.uv.sources]
contracts = { workspace = true }
