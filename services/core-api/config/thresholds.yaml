# Smart Ticket Triage — thresholds. Spec §13.
#
# EVERY tunable number in the system lives here. No threshold literal may
# appear anywhere else in the codebase — thresholds are calibration data,
# not logic (spec §2 rule 2). Values marked 🔧 are placeholder assumptions
# that let the system run from day one; they are meant to be replaced by
# the §7.1 shadow-mode calibration output, not treated as ground truth.
#
# This file is loaded into `contracts.routing.Thresholds` at boot — a
# malformed file fails fast at startup, not mid-request. Whatever version
# is active is snapshotted verbatim into `routing_decisions.thresholds_used`
# so a decision made months ago can always be explained with the numbers
# that were actually in effect at the time.

version: "2026-07-27"
calibration_source: "shadow_run_2026-07 (n=612)"  # 🔧 update after P2 calibration

routing:
  t_auto: 0.88       # 🔧 calibrate: auto-reply precision >= 0.95
  t_route: 0.72      # 🔧 calibrate: auto-route precision >= 0.85
  quote_match: 0.95

retrieval:
  # 🔧 CROSS-ENCODER score, not cosine similarity and not an RRF score
  # (ADR-0005), and never fitted to observed bge-reranker-v2-m3 output.
  #
  # ⚠️ ai-engine's default is RERANKER_PROVIDER=lexical, whose score is a
  # token-overlap ratio — so by default this number is compared against a
  # distribution it was not written for. core-api cannot detect that: it sends
  # this value in AIRunRequest and has no visibility into which provider
  # ai-engine selected. Until that is resolved, refusal behaviour is
  # uncalibrated under BOTH providers, for different reasons.
  # See docs/TODO.md item 4.
  floor: 0.45
  margin: 0.08         # below this → downgrade trust, log "KB ambiguous"
  bm25_top_k: 20
  vector_top_k: 20
  rrf_k: 60             # standard constant from the RRF paper; do not tune
  rerank_top_n: 3

incident:
  similarity: 0.85
  window_minutes: 15
  min_count: 5
  sigma_multiplier: 3.0

fewshot:
  max_per_category: 5
  ttl_days: 90
  min_diversity: 0.30   # mean embedding distance; lower → warn
  require_user_confirmed: true

budget:
  max_tokens_per_ticket: 8000
  max_llm_calls: 4
  # 🔧 Must stay comfortably above the per-call model ceiling
  # (MODEL_TIMEOUT_SEC in core-api and ai-engine, both 120s by
  # default), otherwise the graph's budget guard aborts the run before a
  # single cold-start inference can finish and every ticket degrades to
  # HITL for a reason that is really just "the model was loading".
  # 300 leaves room for one 120s attempt plus a fallback within budget.
  # core-api's HTTP call to ai-engine derives its own timeout from this
  # (max_latency_sec + 5), so raising this raises that automatically.
  max_latency_sec: 300
  max_graph_iterations: 5
  daily_cost_ceiling_usd: 50   # 🔧 exceed → AI off, everything to HITL

alerts:
  reviewer_approve_rate_max: 0.95
  reviewer_median_time_min_sec: 10
  override_rate_delta_max: 0.05
  trust_score_drift_max: 0.10
