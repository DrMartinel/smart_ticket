# Smart Ticket Triage — thresholds. Spec §13.
#
# EVERY tunable number in the system lives here. No threshold literal may
# appear anywhere else in the codebase — thresholds are calibration data,
# not logic (spec §2 rule 2). Values marked 🔧 are placeholder assumptions
# that let the system run from day one; they are meant to be replaced by
# the §7.1 shadow-mode calibration output, not treated as ground truth.
#
# This file is loaded into `config.settings.base.Thresholds` at boot — a
# malformed file fails fast at startup, not mid-request. Whatever version
# is active is snapshotted verbatim into `routing_decisions.thresholds_used`
# so a decision made months ago can always be explained with the numbers
# that were actually in effect at the time.

version: "2026-07-27"
calibration_source: "shadow_run_2026-07 (n=612)"  # 🔧 update after P2 calibration

routing:
  t_auto: 0.88       # 🔧 calibrate: auto-reply precision >= 0.95
  t_route: 0.72      # 🔧 calibrate: auto-route precision >= 0.85
  quote_match: 0.95

retrieval:
  # 🔧 On JEV's scale (ADR-0026): compared with the probability Jev's choice
  # question gives the shortlisted passages together (1 - P(none)), never a
  # cross-encoder, cosine or RRF score (ADR-0005). Jev choosing `none` is
  # below the floor too, so a floor of 0.5 or less adds nothing. 0.6 is
  # inside the 2026-10-14 probe's gap: every out-of-KB ticket 0.27 or less
  # (23/23), every clarify ticket 0.76 or more (28/28); about 1% of 423
  # KB-covered tickets fall below it. Chosen from golden-set data: re-choose
  # on shadow pairs before P3. The top-1 floor of 0.30 refused tickets whose
  # probability Jev split between readings.
  floor: 0.6
  margin: 0.08         # below this → downgrade trust, log "KB ambiguous"
  # 🔧 On Jev's confidence in its rerank choice (ADR-0026). An auto-reply
  # needs Jev to have chosen the cited page with at least this. 0.9 is from
  # the 2026-10-13 probe on the golden set: at >= 0.9 Jev's choice was the
  # right page 93.3% of the time, and 193 of 423 auto-reply proposals cited
  # it at >= 0.9, 96.4% of those on the right page. Re-choose it on shadow
  # pairs before P3.
  min_rerank_confidence: 0.9
  # Retrieval sizes (BM25_TOP_K, VECTOR_TOP_K, RRF_K, RERANK_TOP_N) are
  # ai-engine's, in .env.example: it never reads this file.

incident:
  similarity: 0.85
  window_minutes: 15
  min_count: 5
  sigma_multiplier: 3.0

fewshot:
  max_per_category: 5
  ttl_days: 90
  min_diversity: 0.30   # mean embedding distance; lower → warn
  require_user_confirmed: true

budget:
  # 🔧 How long core-api waits on ai-engine's /v1/analyze (its HTTP read
  # timeout is max_latency_sec + AI_ENGINE_ANALYZE_GRACE_SEC; connect is
  # MODEL_CONNECT_TIMEOUT_SEC). ai-engine enforces no budget of its own, so this
  # must stay comfortably above the per-call model ceiling
  # (MODEL_TIMEOUT_SEC, 120s by default) plus the embedding and rerank
  # calls, or a cold-start inference times out as ai_engine_unavailable.
  max_latency_sec: 300
  daily_cost_ceiling_usd: 50   # 🔧 exceed → AI off, everything to HITL

alerts:
  reviewer_approve_rate_max: 0.95
  reviewer_median_time_min_sec: 10
  override_rate_delta_max: 0.05
  trust_score_drift_max: 0.10
  trust_score_std_min: 0.08    # weekly spread below this → scorer can't tell tickets apart (§7.2)

classification:
  # 🔧 Jev's confidence in its category choice (ADR-0017), below which a
  # route or clarify proposal goes to a human as `category_low_confidence`
  # instead of being routed on a category Jev was unsure of. Confidence is
  # low when Jev's probability is spread over several categories. On the
  # 2026-10-04 probe (83 golden tickets, evals/HISTORY.md 2026-10-04 (5)),
  # below 0.65 held 4 tickets, 2 of them misclassified. Chosen from that one
  # probe: re-choose on shadow data before P3.
  min_confidence: 0.65

clarification:
  # Questions a ticket may ask its requester (ADR-0023). After this many, a
  # clarify proposal goes to a human as `clarify_round_cap`: a requester
  # whose answer was still ambiguous is not asked again.
  max_rounds: 1
  # 🔧 How long a question stays open in the chat. After it, the requester is
  # offered a ticket instead (the user's choice, 2026-10-12): nothing goes to
  # support unless they ask. Chosen as "step away and come back"; re-choose
  # from shadow data on how long requesters take to answer.
  wait_minutes: 60
  # 🔧 Which pages a clarifying question offers (ADR-0023, amended
  # 2026-10-13 and 2026-10-14): core-api builds the buttons, not the LLM.
  # Every distinct page in Jev's top 5 whose yes/no score ("does this
  # passage fix it?", asked per page for a clarify proposal) is within
  # `option_margin` of the best, in Jev's order, at most `max_options`. On
  # JEV's yes/no scale (ADR-0005), the scale it was chosen on. 0.1 is
  # the project owner's choice, checked on 13 live runs of two ambiguous
  # tickets: "VPN not working" offers exactly the Windows and macOS client
  # pages, "I forgot my password" the access portal, root and (when
  # retrieved) WorkSpaces pages; 0.2 also offered administrator pages.
  # Re-choose on shadow data. Fewer than 2 pages: nothing is asked, a
  # person gets the ticket in the clarification queue.
  option_margin: 0.1
  max_options: 5

masking:
  # 🔧 Share of a ticket's text (subject + body) that tier-2 NER's free-form
  # spans may cover beyond what the regex tier masked. Above it the ticket is
  # MASK_FAILED, a human, instead of going on over-masked: NER has masked whole
  # sentences with no PII in them, hiding an injection from the detector (g133)
  # and a request from retrieval (g148), evals/HISTORY.md 2026-10-04 (2).
  # Measured 2026-10-04: whole-ticket over-masking covered 0.80 (g133), 0.86
  # and 1.0 (g141) under pii_ner.v1; short tickets dense with real free-form
  # PII ("Ask Mr. Hung on the 5th floor near the kitchen, he has the toner")
  # cover up to ~0.6, and 0.5 sent them to a human. A backstop for the
  # extreme case; pii_ner.v2 is the fix. Chosen from these few cases:
  # re-choose on shadow data.
  ner_max_share: 0.7

lifecycle:
  # Moves and field writes one action may set off in a chain (ADR-0028):
  # move_status entering a status whose actions move again, set_field firing
  # an event that sets another. Past it the run fails as
  # automation_depth_exceeded instead of looping. Chosen as "deeper than any
  # sane workflow"; not calibrated.
  max_chain_depth: 5
  # Attempts at an action that fails transiently (a webhook's 5xx, a timeout,
  # an SMTP error) before its run fails and its transfer lands in the
  # failed-transfer queue.
  action_max_attempts: 3
  # How long a require_approval run waits for an approver before it counts
  # as rejected and the move is refused.
  approval_wait_hours: 72

access_denied:
  # A refused call writes one access_denied audit row per user, route and
  # method within this window (PRE-1, BR-PRE1-03), so a probing client shows
  # up without flooding audit_log. 🔧 assumption, not measured.
  audit_window_seconds: 60

pii_reveal:
  # Reveals of quarantined PII one person may make in an hour (F5, BR-F5-07).
  # The next is refused with reveal_rate_limited and alerts security.
  # 🔧 assumption, not measured.
  max_per_user_per_hour: 20
  # Seconds a revealed value stays on screen before the admin console hides it.
  display_seconds: 60
