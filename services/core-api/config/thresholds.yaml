# Smart Ticket Triage — thresholds. Spec §13.
#
# EVERY tunable number in the system lives here. No threshold literal may
# appear anywhere else in the codebase — thresholds are calibration data,
# not logic (spec §2 rule 2). Values marked 🔧 are placeholder assumptions
# that let the system run from day one; they are meant to be replaced by
# the §7.1 shadow-mode calibration output, not treated as ground truth.
#
# This file is loaded into `config.settings.base.Thresholds` at boot — a
# malformed file fails fast at startup, not mid-request. Whatever version
# is active is snapshotted verbatim into `routing_decisions.thresholds_used`
# so a decision made months ago can always be explained with the numbers
# that were actually in effect at the time.
#
# `version` names this file in every decision's `thresholds_used`: give a
# changed file a new one. The file changes by pull request like code
# (ADR-0044); the CR-2026-* versions are ids from the change requests ADR-0035
# had, which ADR-0044 removed.

version: "CR-2026-007"
calibration_source: "shadow_run_2026-07 (n=612)"  # 🔧 update after P2 calibration

routing:
  t_auto: 0.88       # 🔧 calibrate: auto-reply precision >= 0.95
  t_route: 0.72      # 🔧 calibrate: auto-route precision >= 0.85
  quote_match: 0.95

retrieval:
  # 🔧 On JEV's scale (ADR-0026): compared with the probability Jev's choice
  # question gives the shortlisted passages together (1 - P(none)), never a
  # cross-encoder, cosine or RRF score (ADR-0005). Jev choosing `none` is
  # below the floor too, so a floor of 0.5 or less adds nothing. 0.6 is
  # inside the 2026-10-14 probe's gap: every out-of-KB ticket 0.27 or less
  # (23/23), every clarify ticket 0.76 or more (28/28); about 1% of 423
  # KB-covered tickets fall below it. Chosen from golden-set data: re-choose
  # on shadow pairs before P3. The top-1 floor of 0.30 refused tickets whose
  # probability Jev split between readings.
  floor: 0.6
  margin: 0.08         # below this → downgrade trust, log "KB ambiguous"
  # 🔧 On Jev's confidence in its rerank choice (ADR-0026). An auto-reply
  # needs Jev to have chosen the cited page with at least this. 0.9 is from
  # the 2026-10-13 probe on the golden set: at >= 0.9 Jev's choice was the
  # right page 93.3% of the time, and 193 of 423 auto-reply proposals cited
  # it at >= 0.9, 96.4% of those on the right page. Re-choose it on shadow
  # pairs before P3.
  min_rerank_confidence: 0.9
  # Retrieval sizes (BM25_TOP_K, VECTOR_TOP_K, RRF_K, RERANK_TOP_N) are
  # ai-engine's, in .env.example: it never reads this file.

incident:
  # Cosine bar for "similar" tickets, and since F7 for a new ticket joining an
  # open incident by its centroid (BR-F7-02).
  similarity: 0.85
  window_minutes: 15
  min_count: 5
  sigma_multiplier: 3.0
  # A confirmed incident's own P1 target, 24×7 from confirmation (BR-F7-10).
  resolve_target_minutes: 240
  # A resolved incident closes itself after this many days (§c).
  auto_close_after_days: 7

fewshot:
  max_per_category: 5
  ttl_days: 90
  min_diversity: 0.30   # mean embedding distance; lower → warn
  require_user_confirmed: true

budget:
  # 🔧 How long core-api waits on ai-engine's /v1/analyze (its HTTP read
  # timeout is max_latency_sec + AI_ENGINE_ANALYZE_GRACE_SEC; connect is
  # MODEL_CONNECT_TIMEOUT_SEC). ai-engine enforces no budget of its own, so this
  # must stay comfortably above the per-call model ceiling
  # (MODEL_TIMEOUT_SEC, 120s by default) plus the embedding and rerank
  # calls, or a cold-start inference times out as ai_engine_unavailable.
  max_latency_sec: 300
  daily_cost_ceiling_usd: 50   # 🔧 exceed → AI off, everything to HITL

alerts:
  reviewer_approve_rate_max: 0.95
  reviewer_median_time_min_sec: 10
  override_rate_delta_max: 0.05
  trust_score_drift_max: 0.10
  trust_score_std_min: 0.08    # weekly spread below this → scorer can't tell tickets apart (§7.2)

classification:
  # 🔧 Jev's confidence in its category choice (ADR-0017), below which a
  # route or clarify proposal goes to a human as `category_low_confidence`
  # instead of being routed on a category Jev was unsure of. Confidence is
  # low when Jev's probability is spread over several categories. On the
  # 2026-10-04 probe (83 golden tickets, evals/HISTORY.md 2026-10-04 (5)),
  # below 0.65 held 4 tickets, 2 of them misclassified. Chosen from that one
  # probe: re-choose on shadow data before P3.
  min_confidence: 0.65

clarification:
  # Questions a ticket may ask its requester (ADR-0023). After this many, a
  # clarify proposal goes to a human as `clarify_round_cap`: a requester
  # whose answer was still ambiguous is not asked again.
  max_rounds: 1
  # 🔧 How long a question stays open in the chat. After it, the requester is
  # offered a ticket instead (the user's choice, 2026-10-12): nothing goes to
  # support unless they ask. Chosen as "step away and come back"; re-choose
  # from shadow data on how long requesters take to answer.
  wait_minutes: 60
  # 🔧 Which pages a clarifying question offers (ADR-0023, amended
  # 2026-10-13 and 2026-10-14): core-api builds the buttons, not the LLM.
  # Every distinct page in Jev's top 5 whose yes/no score ("does this
  # passage fix it?", asked per page for a clarify proposal) is within
  # `option_margin` of the best, in Jev's order, at most `max_options`. On
  # JEV's yes/no scale (ADR-0005), the scale it was chosen on. 0.1 is
  # the project owner's choice, checked on 13 live runs of two ambiguous
  # tickets: "VPN not working" offers exactly the Windows and macOS client
  # pages, "I forgot my password" the access portal, root and (when
  # retrieved) WorkSpaces pages; 0.2 also offered administrator pages.
  # Re-choose on shadow data. Fewer than 2 pages: nothing is asked, a
  # person gets the ticket in the clarification queue.
  option_margin: 0.1
  max_options: 5

masking:
  # 🔧 Share of a ticket's text (subject + body) that tier-2 NER's free-form
  # spans may cover beyond what the regex tier masked. Above it the ticket is
  # MASK_FAILED, a human, instead of going on over-masked: NER has masked whole
  # sentences with no PII in them, hiding an injection from the detector (g133)
  # and a request from retrieval (g148), evals/HISTORY.md 2026-10-04 (2).
  # Measured 2026-10-04: whole-ticket over-masking covered 0.80 (g133), 0.86
  # and 1.0 (g141) under pii_ner.v1; short tickets dense with real free-form
  # PII ("Ask Mr. Hung on the 5th floor near the kitchen, he has the toner")
  # cover up to ~0.6, and 0.5 sent them to a human. A backstop for the
  # extreme case; pii_ner.v2 is the fix. Chosen from these few cases:
  # re-choose on shadow data.
  ner_max_share: 0.7

lifecycle:
  # Moves and field writes one action may set off in a chain (ADR-0028):
  # move_status entering a status whose actions move again, set_field firing
  # an event that sets another. Past it the run fails as
  # automation_depth_exceeded instead of looping. Chosen as "deeper than any
  # sane workflow"; not calibrated.
  max_chain_depth: 5
  # Attempts at an action that fails transiently (a webhook's 5xx, a timeout,
  # an SMTP error) before its run fails and its transfer lands in the
  # failed-transfer queue.
  action_max_attempts: 3

access_denied:
  # A refused call writes one access_denied audit row per user, route and
  # method within this window (PRE-1, BR-PRE1-03), so a probing client shows
  # up without flooding audit_log. 🔧 assumption, not measured.
  audit_window_seconds: 60

pii_reveal:
  # Reveals of quarantined PII one person may make in an hour (F5, BR-F5-07).
  # The next is refused with reveal_rate_limited and alerts security.
  # 🔧 assumption, not measured.
  max_per_user_per_hour: 20
  # Seconds a revealed value stays on screen before the admin console hides it.
  display_seconds: 60

identity:
  # Minutes between Keycloak syncs (F13). A leaver whose back-channel logout
  # was not delivered keeps access at most this long (K11 <= 5 min).
  sync_interval_minutes: 5
  # Break-glass local sign-in: this many failed passwords within the window
  # lock the account for local_lockout_minutes (FR-F13-009). 🔧 OQ-11 defaults.
  local_max_failures: 5
  local_failure_window_minutes: 15
  local_lockout_minutes: 15
  # Accounts that may keep a local password at all (BR-F13-06).
  max_break_glass_accounts: 2
  # Failed syncs in a row before identity_sync_failed is audited (UC-F13-03).
  sync_failures_before_alert: 3

notifications:
  # Sends of one email or webhook message before it is marked failed for a
  # person to retry (F4, FR-F4-007). Backoff between them is
  # LIFECYCLE_RETRY_BACKOFF_* in .env.example. 🔧 assumption, not measured.
  max_attempts: 5
  # A message still `sending` after this many seconds has lost its worker; the
  # sweep puts it back in the queue.
  stuck_after_sec: 120
  # In-app notices older than this are deleted by the daily purge (FR-F4-010).
  in_app_retention_days: 90

assignment:
  # A manual reassignment's note must be at least this long, so the reason is
  # teachable (F2, BR-F2-05).
  reassign_note_min_chars: 10

sla:
  # A clock warns at this share of its target, and a breach is escalated to
  # managers at the second (F1, BR-F1-08). 🔧 OQ-04 defaults, not measured.
  warn_at_percent: 75
  escalate_at_percent: 125
  # From this day (MM-DD) on, a calendar with no holidays entered for next year
  # sends sla.holidays_missing to workflow admins (BR-F1-14).
  holidays_reminder_month_day: "12-01"

requester:
  # A chat conversation ends after this many minutes without a turn; the next
  # question starts a new one with no earlier turns (F3, BR-F3-02, OQ-08).
  conversation_idle_minutes: 30
  # Earlier masked turns of the same conversation sent to ai-engine with a new
  # one, as context for the draft and the proposal only (BR-F3-01, ADR-0034).
  max_prior_turns: 6
  # Characters of an earlier turn's auto-reply sent with it. 🔧 assumption.
  answer_excerpt_chars: 300
  # Calendar days after resolution in which a requester reopens the ticket;
  # afterwards reopening submits a new ticket linked to it (BR-F3-08, OQ-09).
  reopen_window_days: 7
  # My tickets lists completed tickets resolved in this many days after the open ones.
  list_resolved_days: 30
  # Business days (the team's calendar) a ticket waits on its requester before
  # the sweep resolves it (BR-F3-11, F1 UC-F1-03 1a). 🔧 assumption.
  auto_close_after_business_days: 5
  # A rating at or below this sends ticket.rated_low to the team lead and, on an
  # auto-reply, becomes an eval candidate (UC-F3-05 3x: "Rating 1–2").
  low_rating_at_most: 2

security:
  # Repeats of one kind on one ticket (else one user) within this many minutes
  # join one alert instead of raising another (F8, BR-F8-03).
  group_window_minutes: 60
  # This many refused calls by one user within the window raise an
  # access_denied_burst alert (BR-F8-08). 🔧 assumption, not measured.
  access_denied_burst: 20
  access_denied_window_minutes: 10
  # Business minutes on the default calendar to acknowledge an alert, by
  # severity (BR-F8-04, K12): 1 hour, 4 hours, one working day (08:00–17:30).
  ack_business_minutes:
    critical: 60
    high: 240
    medium: 570

kb_gaps:
  # Refused tickets of the last 28 days, grouped weekly into topics KB editors
  # should write or update (F6, BR-F6-07).
  window_days: 28
  cluster_similarity: 0.80   # 🔧 assumption
  min_cluster_size: 3
  # Nearest live chunk at least this similar: the page needs an update; else a
  # new page is missing (BR-F6-08).
  update_similarity: 0.65    # 🔧 assumption, on bge-m3 cosine
  dismiss_days: 90

reports:
  # A reviewer is flagged for rubber-stamping only with at least this many
  # decisions in the window (F10, BR-F10-06), using alerts.reviewer_* below.
  min_decisions_for_flag: 20
  # Rows per page of a report's drill-down list.
  list_page_size: 50
  # Gap closure compares refusals this many weeks before and after a page is
  # published (BR-F10-07).
  gap_closure_weeks: 4
  # Default windows when a report is opened without one: days for the reviewer
  # and notification reports, weeks for the KB refusal trend. The rollout report
  # defaults to the same 14-day shadow-agreement window F9's gates read.
  window_days: 30
  kb_weeks: 8
  rollout_days: 14

access:
  # Levels a department tree may have below the root, the root counted as 1
  # (F14, BR-F14-10).
  department_max_depth: 6
  # Days a mover's old department-scoped grants wait for confirmation before
  # they end (BR-F14-13). 🔧 assumption, not measured.
  mover_review_days: 14
  # Hours before a time-bound grant ends that the person is told (BR-F14-16).
  expiry_notice_hours: 48
  # Days an access review stays open when it is opened without a close date,
  # and days before closing that reviewers with work left are reminded.
  review_default_days: 14
  review_reminder_days: 3
  # Rows one CSV import may hold (FR-F14-005).
  import_max_rows: 2000

agent:
  # Model calls, tool calls and model tokens (in + out) one turn may use; core-api
  # also refuses a turn's write calls beyond max_tool_calls_per_turn
  # (FR-F15-015). 🔧 assumptions, not measured.
  max_steps: 8
  max_tool_calls_per_turn: 6
  max_model_tokens_per_turn: 16000
  # Seconds an agent turn's token lives (F15, BR-F15-02); it also dies with
  # the turn and with the sign-in it was minted from. 🔧 assumption, not measured.
  token_ttl_seconds: 300
  # Minutes a call the agent proposed waits for the user's confirmation, and
  # hours a draft it left on a human-only route waits for a person (BR-F15-06,
  # BR-F15-07). 🔧 assumptions, not measured.
  confirm_ttl_minutes: 30
  draft_ttl_hours: 72
  # Earlier turns of the same agent conversation a new turn carries
  # (BR-F15-17), and minutes after which an idle conversation ends. 🔧
  max_earlier_turns: 6
  conversation_idle_minutes: 30
